name: Compile Quarto Document

on:
  push:
    branches:
      - main
    paths:
      - "**.qmd"
      - "**.bib"
      - "_quarto.yml"
  pull_request:
    paths:
      - "**.qmd"
      - "**.bib"
      - "_quarto.yml"

jobs:
  compile-quarto:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Quarto CLI
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Install Pandoc (Quarto bundles its own, but this ensures latest)
      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      # Compile the Quarto document
      - name: Render Quarto document
        run: |
          mapfile -t qmd_files < <(find . -maxdepth 1 -type f -name "*.qmd" -printf "%f\n" | sort)

          if [ "${#qmd_files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .qmd file in repo root, found ${#qmd_files[@]}: ${qmd_files[*]:-(none)}"
            exit 1
          fi

          qmd_file="${qmd_files[0]}"
          base_name="${qmd_file%.qmd}"

          echo "QMD_FILE=$qmd_file" >> "$GITHUB_ENV"
          echo "PDF_OUTPUT=${base_name}.pdf" >> "$GITHUB_ENV"

          quarto render "$qmd_file" --to pdf

      # Upload the compiled output
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-quarto-document
          path: |
            *.pdf
          retention-days: 90
