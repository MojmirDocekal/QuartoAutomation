name: Compile Quarto Document

on:
  push:
    branches:
      - main
    paths:
      - "**.qmd"
      - "**.bib"
      - "_quarto.yml"
  pull_request:
    paths:
      - "**.qmd"
      - "**.bib"
      - "_quarto.yml"

jobs:
  compile-quarto:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Quarto CLI
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Install Pandoc (Quarto bundles its own, but this ensures latest)
      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      # Compile the Quarto document
      - name: Render Quarto document
        run: |
          quarto render presentation.qmd --to revealjs

      # Upload the compiled output
      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-presentation
          path: |
            presentation.html
            presentation_files/
          retention-days: 90
